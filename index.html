<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2a2230">
<title>Mitos: mundo abierto</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="iconos/icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="iconos/icono-192.png">
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<main id="superficie-juego" aria-label="Mundo de Mitos">
<canvas id="lienzo" role="img" aria-label="Mapa del juego"></canvas>

<div id="hud">
  <div id="contadores">
    <div class="chip"><span class="chip-icono" data-icono="zona"></span><span id="zona-nombre"></span> <b id="zona-n">0/0</b></div>
    <div class="chip"><span class="chip-icono" data-icono="objeto"></span>Total <b id="total-n">0/0</b></div>
    <div class="chip" id="chip-eco" hidden><span class="chip-icono" id="eco-simbolo"></span><span id="eco-texto"></span></div>
  </div>
  <div id="botones-hud">
    <button id="btn-menu" class="boton-redondo" aria-label="Menú"></button>
    <button id="btn-ficha" class="boton-redondo" aria-label="Ver la ficha del personaje"></button>
  </div>
</div>

<div id="aviso" role="status" aria-live="polite" hidden></div>
<div id="pista-cambio" hidden><div class="cartel"><span>Tocá a otro personaje para usar su poder</span><span class="flecha-pista" data-icono="flecha"></span></div></div>

<div id="controles">
  <p id="ayuda-teclado"><span>Mover: <kbd>W A S D</kbd> o <kbd>flechas</kbd></span><span>Personajes: <kbd>1–5</kbd></span><span>Menú: <kbd>Esc</kbd></span></p>
  <div id="fila-acciones">
    <div id="zona-joystick"><div id="joystick"><div id="palanca"></div></div></div>
    <div id="botones">
      <button id="btn-hablar" class="boton-accion" aria-label="Hablar" aria-keyshortcuts="T" hidden><span class="ico"></span><kbd class="atajo-accion">T</kbd></button>
      <button id="btn-poder" class="boton-accion" aria-label="Poder" aria-keyshortcuts="E"><span class="ico"></span><kbd class="atajo-accion">E</kbd></button>
      <button id="btn-salto" class="boton-accion" aria-label="Saltar" aria-keyshortcuts="Space"><span class="ico"></span><span class="etiqueta">Saltar</span><kbd class="atajo-accion">Espacio</kbd></button>
    </div>
  </div>
  <nav id="tira" aria-label="Personajes"></nav>
</div>
</main>

<section id="pantalla-perfiles" class="pantalla" hidden>
  <div class="tarjeta">
    <h1>Mitos: mundo abierto</h1>
    <p class="sub">¿Quién juega?</p>
    <ul id="lista-perfiles"></ul>
    <form id="form-nuevo" autocomplete="off">
      <label for="nombre-nuevo">Perfil nuevo</label>
      <div class="fila-form">
        <input id="nombre-nuevo" type="text" maxlength="14" placeholder="Nombre" enterkeyhint="done">
        <button type="submit" class="boton-grande">Crear</button>
      </div>
    </form>
    <p id="msg-perfiles" class="sub" hidden></p>
  </div>
</section>

<section id="pantalla-eleccion" class="pantalla" hidden>
  <div class="tarjeta eleccion" role="dialog" aria-labelledby="eleccion-titulo">
    <h2 id="eleccion-titulo">¿Con quién empezás?</h2>
    <p class="sub">Los demás se suman conversando con la gente del mundo y explorando.</p>
    <div id="eleccion-lista"></div>
    <button id="eleccion-volver" class="boton-grande claro">Volver</button>
  </div>
</section>

<section id="pantalla-ficha" class="pantalla" hidden>
  <div class="tarjeta ficha" role="dialog" aria-labelledby="ficha-nombre">
    <button id="ficha-cerrar" class="boton-redondo cerrar" aria-label="Cerrar la ficha" data-icono="cerrar"></button>
    <canvas id="ficha-retrato" width="168" height="168" aria-hidden="true"></canvas>
    <h2 id="ficha-nombre"></h2>
    <p id="ficha-texto"></p>
    <div class="caja-poder">
      <h3 id="ficha-poder-titulo"></h3>
      <div id="ficha-poder"></div>
    </div>
    <div class="caja-habilidades">
      <h3>Habilidades</h3>
      <ul id="ficha-habilidades"></ul>
    </div>
    <p id="ficha-senal"></p>
    <div class="fila-ficha">
      <button id="ficha-anterior" class="boton-grande claro"></button>
      <button id="ficha-siguiente" class="boton-grande"></button>
    </div>
  </div>
</section>

<section id="pantalla-charla" hidden>
  <div class="tarjeta-charla" role="dialog" aria-labelledby="charla-nombre">
    <button id="charla-cerrar" class="boton-redondo cerrar" aria-label="Cerrar la charla" data-icono="cerrar"></button>
    <div class="charla-cabecera"><span id="charla-marcador" class="marcador-charla" aria-hidden="true"></span><h2 id="charla-nombre"></h2></div>
    <p id="charla-texto"></p>
    <div id="charla-opciones"></div>
  </div>
</section>

<section id="pantalla-menu" class="pantalla" hidden>
  <div class="tarjeta">
    <h2 id="menu-titulo">Pausa</h2>
    <div id="menu-principal">
      <button id="menu-seguir" class="boton-grande">Seguir jugando</button>
      <button id="menu-objetos" class="boton-grande claro">Mis objetos</button>
      <button id="menu-pruebas" class="boton-grande claro">Campo de pruebas</button>
      <button id="menu-perfiles" class="boton-grande claro">Cambiar de perfil</button>
    </div>
    <div id="menu-lista" hidden>
      <ul id="lista-objetos"></ul>
      <button id="menu-volver" class="boton-grande claro">Volver</button>
    </div>
  </div>
</section>

<script type="module" src="principal.js"></script>
</body>
</html>
